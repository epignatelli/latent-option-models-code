# Experiment: does temporal abstraction improve latent option quality?
#
# Conditions:
#   LAM (baseline)  horizon=1   num_options=98   (one code per atomic action)
#   LOM (proposed)  horizon=128 num_options=256  (temporally extended options)
#
# Both conditions train a unified OptionEncoder + ActionEncoder + shared FrameDecoder.
# The option VQ captures the horizon-level intent; the action VQ grounds it to x_{t+1}.

sweep:
  seeds: [0, 1, 2]
  lam_batch_size: 512
  lom_batch_size: 256

data:
  dataset_dir: /scratch/uceeepi/lom/datasets/nle/nao-top10
  context_len: 16
  horizon: 128
  stride: 4
  buffer_size: 50
  refresh_every: 60

model:
  latent_dim: 512
  num_options: 256
  patch_size: 8

train:
  ckpt_dir: /scratch/uceeepi/lom/checkpoints/benchmark
  max_iters: 200_000
  warmup_iters: 2_000
  log_interval: 50
  eval_interval: 500
  eval_iters: 50

wandb:
  project: latent-option-models
  entity: epignatelli_
  group: benchmark
  dir: /scratch/uceeepi/lom/wandb
